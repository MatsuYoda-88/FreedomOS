name: Build FreedomOS installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the Python code compiles
        run: python -m compileall -q app

      - name: Build WiBro (the FreedomOS app window)
        run: dotnet publish app/browser/src/FreedomOS.csproj -c Release -r win-x64 --self-contained true -o app/browser/builds/b0

      - name: Mark it as the current build
        run: python installer/stamp_build.py

      - name: Read the version
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content app/config.json -Raw | ConvertFrom-Json).version
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "$env:ProgramFiles\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" installer/FreedomOS.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: FreedomOS-Setup-${{ steps.ver.outputs.version }}
          path: dist/*.exe

      - name: Publish the release (every push to main, named after the version in app/config.json)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: FreedomOS ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/*.exe
          make_latest: true
          body: |
            **Download `FreedomOS-Setup-${{ steps.ver.outputs.version }}.exe` below and run it.**

            Windows may say "Windows protected your PC" (the installer isn't code-signed) - click **More info → Run anyway**.

            📖 [Setup guide for every feature](https://github.com/${{ github.repository }}/blob/main/docs/SETUP.md) · 🔒 [Tailscale guide](https://github.com/${{ github.repository }}/blob/main/docs/TAILSCALE.md) · 🙏 [Credits](https://github.com/${{ github.repository }}/blob/main/CREDITS.md)
